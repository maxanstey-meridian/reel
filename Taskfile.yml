version: '3'

tasks:
  server:build:
    desc: Build server project
    dir: server
    cmds:
      - dotnet build Reel.Server/Reel.Server.csproj

  server:test:
    desc: Run server tests
    dir: server
    cmds:
      - dotnet test Reel.slnx

  server:contract:
    desc: Check server API contract coverage
    dir: server
    cmds:
      - dotnet rivet --project Reel.Server/Reel.Server.csproj --check --quiet

  server:run:
    desc: Run server
    dir: server
    cmds:
      - dotnet run --project Reel.Server/Reel.Server.csproj

  tv:build:
    desc: Assemble debug APK
    dir: tv
    cmds:
      - ./gradlew :app:assembleDebug

  tv:test:
    desc: Run TV unit tests
    dir: tv
    cmds:
      - ./gradlew :app:testDebugUnitTest

  tv:install:
    desc: Sideload debug APK to connected Fire TV via ADB
    dir: tv
    cmds:
      - adb install -r app/build/outputs/apk/debug/app-debug.apk

  dev:
    desc: Run server and web UI concurrently
    deps:
      - server:run
      - web:dev

  web:rivet:
    desc: Regenerate Rivet API client from server contracts
    dir: web
    cmds:
      - pnpm rivet
      - pnpm rivet:types

  web:rivet:verify:
    desc: Verify generated API files are current
    dir: web
    cmds:
      - pnpm rivet --verify
      - pnpm exec openapi-typescript generated/rivet/openapi.json -o generated/rivet/schema.d.ts --check

  web:dev:
    desc: Start web UI dev server
    dir: web
    cmds:
      - pnpm dev --host

  web:build:
    desc: Build web UI for production
    dir: web
    cmds:
      - pnpm build

  web:check:
    desc: Typecheck, lint, test, and build the web app
    dir: web
    cmds:
      - pnpm check
      - pnpm lint
      - pnpm test
      - pnpm build

  web:test:
    desc: Run web unit tests
    dir: web
    cmds:
      - pnpm test

  web:e2e:
    desc: Run web e2e tests (Playwright)
    dir: web
    cmds:
      - pnpm e2e

  web:lint:
    desc: Lint web UI (oxlint + eslint)
    dir: web
    cmds:
      - pnpm lint

  web:fmt:
    desc: Format web UI (oxfmt)
    dir: web
    cmds:
      - pnpm fmt

  check:
    desc: Run all application checks
    cmds:
      - task: server:test
      - task: server:contract
      - task: web:check
      - task: tv:test

  ci:
    desc: Verify generated contracts and all application behavior
    cmds:
      - task: web:rivet:verify
      - task: check
      - task: web:e2e
