[versions]
agp                    = "8.7.3"
kotlin                 = "2.0.21"
core-ktx               = "1.15.0"
material3              = "1.12.0"
compose-material3      = "1.3.1"
activity-compose       = "1.9.3"
tv-foundation          = "1.0.0-beta01"
tv-material            = "1.0.0"
media3                 = "1.9.3"
ktor                   = "2.3.12"
kotlinx-serialization  = "1.6.3"
lifecycle              = "2.8.7"
coroutines             = "1.9.0"

[libraries]
# AndroidX core
androidx-core-ktx           = { module = "androidx.core:core-ktx",                  version.ref = "core-ktx" }
androidx-activity-compose   = { module = "androidx.activity:activity-compose",       version.ref = "activity-compose" }

# Material3 (theme parent for TV)
androidx-material3          = { module = "com.google.android.material:material",     version.ref = "material3" }

# Compose Material3
androidx-compose-material3  = { module = "androidx.compose.material3:material3", version.ref = "compose-material3" }
compose-icons-extended      = { module = "androidx.compose.material:material-icons-extended", version.ref = "compose-material3" }

# Compose for TV
androidx-tv-foundation      = { module = "androidx.tv:tv-foundation",                version.ref = "tv-foundation" }
androidx-tv-material        = { module = "androidx.tv:tv-material",                  version.ref = "tv-material" }

# Media3 / ExoPlayer
media3-exoplayer            = { module = "androidx.media3:media3-exoplayer",          version.ref = "media3" }
media3-ui                   = { module = "androidx.media3:media3-ui",                 version.ref = "media3" }
media3-ui-compose           = { module = "androidx.media3:media3-ui-compose",         version.ref = "media3" }
media3-session              = { module = "androidx.media3:media3-session",            version.ref = "media3" }

# Ktor HTTP client
ktor-client-android         = { module = "io.ktor:ktor-client-android",              version.ref = "ktor" }
ktor-client-content-neg     = { module = "io.ktor:ktor-client-content-negotiation",  version.ref = "ktor" }
ktor-serialization-json     = { module = "io.ktor:ktor-serialization-kotlinx-json",  version.ref = "ktor" }

# kotlinx-serialization
kotlinx-serialization-json  = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# Coroutines
kotlinx-coroutines-android  = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

# Lifecycle
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose   = { module = "androidx.lifecycle:lifecycle-runtime-compose",   version.ref = "lifecycle" }

# Testing
junit                       = { module = "junit:junit",                                       version = "4.13.2" }
ktor-client-mock            = { module = "io.ktor:ktor-client-mock",                          version.ref = "ktor" }
kotlinx-coroutines-test     = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test",     version.ref = "coroutines" }
robolectric                 = { module = "org.robolectric:robolectric",                        version = "4.14.1" }
compose-ui-test-junit4      = { module = "androidx.compose.ui:ui-test-junit4",                 version.ref = "compose-material3" }
compose-ui-test-manifest    = { module = "androidx.compose.ui:ui-test-manifest",               version.ref = "compose-material3" }

[plugins]
android-application         = { id = "com.android.application",            version.ref = "agp" }
kotlin-android              = { id = "org.jetbrains.kotlin.android",       version.ref = "kotlin" }
kotlin-serialization        = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose              = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
