[versions]
agp                    = "8.7.3"
kotlin                 = "2.0.21"
compose-compiler       = "1.5.15"
core-ktx               = "1.15.0"
activity-compose       = "1.9.3"
tv-foundation          = "1.0.0-beta01"
tv-material            = "1.0.1"
media3                 = "1.4.1"
ktor                   = "2.3.12"
kotlinx-serialization  = "1.6.3"
lifecycle              = "2.8.7"
coroutines             = "1.9.0"

[libraries]
# AndroidX core
androidx-core-ktx           = { module = "androidx.core:core-ktx",                  version.ref = "core-ktx" }
androidx-activity-compose   = { module = "androidx.activity:activity-compose",       version.ref = "activity-compose" }

# Compose for TV
androidx-tv-foundation      = { module = "androidx.tv:tv-foundation",                version.ref = "tv-foundation" }
androidx-tv-material        = { module = "androidx.tv:tv-material",                  version.ref = "tv-material" }

# Media3 / ExoPlayer
media3-exoplayer            = { module = "androidx.media3:media3-exoplayer",          version.ref = "media3" }
media3-ui                   = { module = "androidx.media3:media3-ui",                 version.ref = "media3" }

# Ktor HTTP client
ktor-client-android         = { module = "io.ktor:ktor-client-android",              version.ref = "ktor" }
ktor-client-content-neg     = { module = "io.ktor:ktor-client-content-negotiation",  version.ref = "ktor" }
ktor-serialization-json     = { module = "io.ktor:ktor-serialization-kotlinx-json",  version.ref = "ktor" }

# kotlinx-serialization
kotlinx-serialization-json  = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# Coroutines
kotlinx-coroutines-android  = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

# Lifecycle
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose   = { module = "androidx.lifecycle:lifecycle-runtime-compose",   version.ref = "lifecycle" }

[plugins]
android-application         = { id = "com.android.application",            version.ref = "agp" }
kotlin-android              = { id = "org.jetbrains.kotlin.android",       version.ref = "kotlin" }
kotlin-serialization        = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose              = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
