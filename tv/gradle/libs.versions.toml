[versions]
agp                    = "8.7.3"
kotlin                 = "2.0.21"
core-ktx               = "1.15.0"
compose-bom            = "2024.12.01"
activity-compose       = "1.9.3"
tv-material            = "1.0.0"
media3                 = "1.9.3"
ktor                   = "2.3.12"
kotlinx-serialization  = "1.6.3"
lifecycle              = "2.8.7"
coroutines             = "1.9.0"
ktlint-gradle          = "14.2.0"
ktlint-cli             = "1.8.0"

[libraries]
androidx-core-ktx           = { module = "androidx.core:core-ktx",                   version.ref = "core-ktx" }
androidx-activity-compose   = { module = "androidx.activity:activity-compose",        version.ref = "activity-compose" }
compose-bom                 = { module = "androidx.compose:compose-bom",              version.ref = "compose-bom" }
androidx-compose-material3  = { module = "androidx.compose.material3:material3" }
androidx-tv-material        = { module = "androidx.tv:tv-material",                   version.ref = "tv-material" }
media3-exoplayer            = { module = "androidx.media3:media3-exoplayer",          version.ref = "media3" }
media3-ui                   = { module = "androidx.media3:media3-ui",                 version.ref = "media3" }
ktor-client-android         = { module = "io.ktor:ktor-client-android",              version.ref = "ktor" }
ktor-client-content-neg     = { module = "io.ktor:ktor-client-content-negotiation",  version.ref = "ktor" }
ktor-serialization-json     = { module = "io.ktor:ktor-serialization-kotlinx-json",  version.ref = "ktor" }
kotlinx-serialization-json  = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-android  = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
lifecycle-runtime-compose   = { module = "androidx.lifecycle:lifecycle-runtime-compose",   version.ref = "lifecycle" }
zxing-core                  = { module = "com.google.zxing:core",                      version = "3.5.3" }

junit                       = { module = "junit:junit",                                       version = "4.13.2" }
ktor-client-mock            = { module = "io.ktor:ktor-client-mock",                          version.ref = "ktor" }
kotlinx-coroutines-test     = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test",     version.ref = "coroutines" }
robolectric                 = { module = "org.robolectric:robolectric",                        version = "4.14.1" }

[plugins]
android-application         = { id = "com.android.application",            version.ref = "agp" }
kotlin-android              = { id = "org.jetbrains.kotlin.android",       version.ref = "kotlin" }
kotlin-serialization        = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose              = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ktlint                      = { id = "org.jlleitschuh.gradle.ktlint",       version.ref = "ktlint-gradle" }
